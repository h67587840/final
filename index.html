"], "exp": "杯底的紙團沒有溼，因為杯子裡有空氣。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "把裝有紙團的杯子倒過來壓入水中，杯底的紙團沒有溼。這說明了什麼？", "options": ["空氣占有空間，把水擋在杯子外面", "空氣是固體", "空氣會發光", "空氣有甜味"], "exp": "空氣和其他物質一樣，占有空間。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "空氣有固定的形狀嗎？", "options": ["沒有固定的形狀", "有，像正方形", "有，像圓形", "有，永遠是三角形"], "exp": "空氣沒有固定的形狀。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "空氣流動會形成什麼？", "options": ["風", "雨", "雪", "彩虹"], "exp": "空氣流動產生風。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "我們呼吸需要什麼？", "options": ["空氣", "石頭", "磁鐵", "砂糖"], "exp": "我們的呼吸需要空氣。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "汙染的空氣會對我們造成什麼影響？", "options": ["會影響健康", "會讓人更健康", "對人完全沒有影響", "會讓植物發出香味"], "exp": "汙染的空氣會影響健康。"}, {"stage": 3, "unit": "三上｜奇妙的空氣", "q": "「空氣品質指標」可以幫助我們知道什麼？", "options": ["空氣品質的好壞，並分成不同等級", "今天有幾隻鳥在飛", "磁鐵的磁力有多強", "水杯裡有多少水"], "exp": "空氣品質指標把空氣品質分成不同的等級。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "下列哪一組都是廚房中常見的材料？", "options": ["砂糖、食鹽、麵粉", "石頭、磁鐵、鐵釘", "鉛筆、橡皮擦、色紙", "書本、直尺、膠帶"], "exp": "廚房中常用的材料有砂糖、食鹽、小蘇打粉、檸檬酸粉和麵粉等。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "觀察砂糖、食鹽這些細小的粉末時，可以使用什麼工具把它們看得更清楚？", "options": ["放大鏡", "磁鐵", "溫度計", "量筒"], "exp": "放大鏡可以幫助我們把細小的東西看得更清楚。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "砂糖放進水裡攪拌，慢慢不見了，這種現象叫做什麼？", "options": ["溶解", "生長", "發芽", "浮起來"], "exp": "砂糖在水中慢慢不見的現象叫做溶解。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "砂糖可以一直加進同一杯水裡，一直溶解下去嗎？", "options": ["不行，水能溶解的砂糖是有限的", "可以，一直都溶得完", "不行，因為砂糖會變成食鹽", "可以，水會越來越多"], "exp": "砂糖的溶解有限度，不是無限的。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "實驗時要量取一定量的水，可以使用什麼器材？", "options": ["量筒", "放大鏡", "磁鐵", "迴紋針"], "exp": "量筒可以量取一定量的水。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "量取水的量時，常用的單位是什麼？", "options": ["毫升", "公斤", "公尺", "度"], "exp": "量取水的量，常用「毫升」作為單位。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "水溶液依照性質，可以分成哪三種？", "options": ["酸性、中性、鹼性", "高、中、低", "紅、黃、藍", "大、中、小"], "exp": "水溶液可以分成酸性、中性和鹼性。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "紫色高麗菜汁可以幫助我們做什麼？", "options": ["分辨水溶液的酸鹼性", "測量水的重量", "測量水的溫度", "把水變成冰"], "exp": "紫色高麗菜汁會隨水溶液的酸鹼性改變顏色，可以幫助我們分辨水溶液。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "下列哪一種水溶液是酸性的？", "options": ["醋", "食鹽水", "砂糖水", "小蘇打水"], "exp": "醋和檸檬酸水是酸性的；小蘇打水是鹼性的。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "小蘇打水是哪一種性質的水溶液？", "options": ["鹼性", "酸性", "中性", "沒有性質"], "exp": "小蘇打水是鹼性的水溶液。"}, {"stage": 4, "unit": "三上｜廚房裡的科學", "q": "把紫色高麗菜汁分別加入下列水溶液，哪一種的顏色幾乎不會改變？", "options": ["食鹽水", "醋", "檸檬酸水", "小蘇打水"], "exp": "加入食鹽水、砂糖水，紫色高麗菜汁不會變色。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "蔬菜生長需要哪些條件？", "options": ["陽光、空氣、水、土壤", "只需要砂糖", "只需要磁鐵", "只需要冰塊"], "exp": "生物需要陽光、空氣、水和土壤，才能維持生命和生長。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "下列哪一個順序，是蔬菜生長的過程？", "options": ["種子→發芽→長葉→長高長大→開花→結果→枯死", "發芽→種子→開花→長葉→枯死→結果", "種子→開花→發芽→結果→長葉→枯死", "結果→開花→長葉→發芽→種子→枯死"], "exp": "蔬菜的一生會經歷種子、發芽、長葉、長高長大、開花、結果，最後枯死。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "我們吃的蔬菜，是植物的哪些部位？", "options": ["可能是根、莖、葉、花、果實或種子", "只有根", "只有花", "都不是植物的部位"], "exp": "不同的蔬菜，食用的部位不同，可能是植物的根、莖、葉、花、果實或種子。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "種菜時，可以用什麼來記錄蔬菜的成長變化？", "options": ["蔬菜觀察記錄表", "溫度計", "磁鐵", "量筒"], "exp": "種菜時要觀察並記錄蔬菜的生長變化。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "蔬菜種子播種後，接下來會經歷哪個階段？", "options": ["發芽", "開花", "結果", "枯死"], "exp": "蔬菜的生長順序是種子、發芽，再繼續長大。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "蔬菜種子發芽後長出來的小植物，叫做什麼？", "options": ["幼苗", "果實", "花萼", "雄蕊"], "exp": "蔬菜種子發芽後，會長成幼苗。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "用有開口的紙箱蓋住蔬菜幼苗，是想觀察什麼對蔬菜生長的影響？", "options": ["陽光", "磁力", "雨量", "風向"], "exp": "透過觀察與實驗，可以了解陽光對蔬菜生長的影響。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "蔬菜開花、結果之後，利用什麼來繁衍下一代？", "options": ["種子", "磁鐵", "空氣", "雨量"], "exp": "生物壽命有限，利用種子繁衍後代，讓生命延續下去。"}, {"stage": 5, "unit": "三下｜田園樂", "q": "種菜之前，可以先做什麼準備？", "options": ["查資料，了解蔬菜的種植方式，並選擇適合當季種植的蔬菜", "把種子丟進水溝", "不用準備，直接等著收成", "把蔬菜種在冰箱裡"], "exp": "種菜前要先蒐集資料，了解蔬菜的生長條件和種植方式。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "下列哪些因素，可能會讓物質產生變化？", "options": ["溫度、空氣和水", "名字、年齡和體重", "聲音、顏色和味道", "數字、文字和圖畫"], "exp": "物質會受到溫度、空氣和水等因素影響，可能產生變化。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "水有哪三種形態？", "options": ["液態、固態、氣態", "酸性、中性、鹼性", "大、中、小", "冷、熱、溫"], "exp": "水有液態、固態和氣態三種形態。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "冰是水的哪一種形態？", "options": ["固態", "液態", "氣態", "沒有形態"], "exp": "冰是固態的水。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "水蒸氣是水的哪一種形態？", "options": ["氣態", "固態", "液態", "沒有形態"], "exp": "水蒸氣是氣態的水。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "冰受熱，變成液態水的現象，叫做什麼？", "options": ["融化", "蒸發", "溶解", "發芽"], "exp": "冰受熱，固態冰變成液態水的現象叫做融化。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "水變成看不見、散布在空氣中的水蒸氣，這個現象叫做什麼？", "options": ["蒸發", "融化", "溶解", "生長"], "exp": "水變成水蒸氣的現象叫做蒸發。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "想讓濕毛巾比較快乾，下列哪一種做法比較好？", "options": ["放在太陽下曬", "放在冰箱裡", "用塑膠袋包起來", "放在陰暗的櫃子裡"], "exp": "提高溫度、用風吹，都可以讓水蒸發得比較快。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "冰塊放在不同形狀的容器裡，冰塊的形狀會改變嗎？", "options": ["不會，冰是固態，形狀固定不變", "會，冰會跟著容器改變形狀", "會，冰會變成氣體", "不會，因為冰是氣態"], "exp": "液態水會因容器改變形狀，固態冰的形狀固定不變。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "把水倒進不同形狀的容器裡，水會怎麼樣？", "options": ["形狀會跟著容器改變", "形狀固定不變", "立刻變成冰", "立刻變成氣體"], "exp": "液態水會因容器改變形狀。"}, {"stage": 6, "unit": "三下｜溫度變化對物質的影響", "q": "溫度升高時，冰會怎麼樣？", "options": ["會融化，溫度會影響冰融化的快慢", "不會有任何變化", "會變得更硬", "會變成蔬菜"], "exp": "溫度升高時冰會融化，溫度會影響冰融化的快慢。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "常見動物的身體，主要分成哪幾個部分？", "options": ["頭、軀幹和肢", "根、莖和葉", "花萼、花瓣和雄蕊", "種子、果實和花"], "exp": "常見動物的身體分為頭、軀幹和肢。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "常見的動物可以分成哪些類別？", "options": ["哺乳類、兩生類、魚類、鳥類、爬蟲類等", "蔬菜類、水果類、花草類", "金屬類、塑膠類、木頭類", "酸性、鹼性、中性"], "exp": "常見的動物可以分為哺乳類、兩生類、魚類、鳥類、爬蟲類及其他種類。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "動物的身體構造和功能，有什麼關係？", "options": ["構造和功能是互相配合的", "構造和功能完全沒有關係", "構造越多，功能越少", "沒有構造也能有功能"], "exp": "動物的身體構造與功能是互相配合的。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "不同的動物，外形特徵都一樣嗎？", "options": ["不一樣，不同的動物有不同的外形特徵", "一樣，所有動物都長得一樣", "一樣，所有動物都有翅膀", "一樣，所有動物都有鰭"], "exp": "不同的動物，具有不同的外形特徵。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "兔、蛙和蜥蜴的身體都有什麼？", "options": ["頭、軀幹和四肢", "根、莖和葉", "花瓣和花萼", "果實和種子"], "exp": "兔、蛙、蜥蜴的身體都有頭、軀幹和四肢。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "不同的環境，會有什麼樣的生物生存？", "options": ["不同的環境有不同的生物生存", "所有環境的生物都一模一樣", "只有一種環境有生物", "沒有任何環境有生物"], "exp": "不同的環境有不同的生物生存。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "動物生長需要什麼？", "options": ["食物", "磁鐵", "量筒", "放大鏡"], "exp": "動物生長需要食物。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "動物察覺到環境的改變時，會怎麼樣？", "options": ["會做出身體或行為的反應", "什麼反應都不會有", "會變成植物", "會變成石頭"], "exp": "動物的感覺器官接受外界刺激，會引起生理和行為反應。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "動物的外形顏色和環境相似或相異，有什麼幫助？", "options": ["能幫助牠們生存", "能讓牠們變成植物", "能讓牠們變成石頭", "能讓牠們不需要吃東西"], "exp": "動物的外形顏色與環境相似或相異，能幫助牠們生存。"}, {"stage": 7, "unit": "三下｜我是動物解說員", "q": "動物的外形有些和人類相像，有些不同，但都具有什麼功能？", "options": ["幫助動物適應環境", "幫助動物變成人類", "讓動物長出根", "讓動物發芽"], "exp": "動物的外形都具有功能，可以幫助動物適應環境。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "測量雨量時，雨量的單位是什麼？", "options": ["毫米（mm）", "公斤", "公尺", "度"], "exp": "雨量的單位是毫米（mm）。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "下列哪一種容器比較適合用來收集雨水、測量雨量？", "options": ["平底直筒的容器", "上寬下窄的碗", "圓錐形的漏斗", "球形的瓶子"], "exp": "平底直筒的容器比較適合作為雨量器。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "收集雨水的時候，適合選在哪裡？", "options": ["空曠、沒有遮蔽物的地方，例如草地上", "屋簷下", "大樹下", "走廊裡"], "exp": "收集雨水時，要選空曠、沒有遮蔽物的地方，例如草地上。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "天氣預報常用哪些資料來表達天氣狀態？", "options": ["雨量、溫度、風向、風速", "體重、身高、年齡、視力", "花的顏色、葉子形狀、果實大小、種子數量", "岩石硬度、土壤顏色、沙子大小、水的重量"], "exp": "天氣預報常用雨量、溫度、風向、風速等資料來表達天氣狀態。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "晴天、多雲、陰天，主要是根據什麼來判斷的？", "options": ["天空中雲的多少（雲況）", "風的顏色", "雨水的味道", "溫度計的大小"], "exp": "可以根據雲況來說明天氣狀況。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "雲況和天氣狀況有什麼關係？", "options": ["有密切的關係，雲是天氣變化的徵兆", "完全沒有關係", "雲只會在晴天出現", "雲會讓溫度計變重"], "exp": "雲是天氣變化的徵兆，各種雲況和天氣狀況有密切的關係。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "觀察天氣時，可以從哪些方面來觀察？", "options": ["雲量、氣溫、風、雨", "體重、身高、視力、年齡", "磁鐵、迴紋針、橡皮擦、鉛筆", "砂糖、食鹽、麵粉、小蘇打"], "exp": "天氣狀況可以從雲量、氣溫、風和雨來觀察。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "測量氣溫，要使用什麼？", "options": ["溫度計", "磁鐵", "放大鏡", "迴紋針"], "exp": "天氣的資料可以使用適當的儀器測得，測量氣溫要用溫度計。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "一年四季的氣溫和天氣會有什麼不同？", "options": ["氣溫和天氣都會有所不同", "四季都完全一樣", "只有氣溫會變，天氣不會", "只有天氣會變，氣溫不會"], "exp": "一年四季氣溫會有所變化，天氣也會有所不同。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "氣象報告可以讓我們知道什麼？", "options": ["天氣可能會有什麼變化", "明天考試會考幾分", "磁鐵的磁力有多強", "蔬菜有幾片葉子"], "exp": "氣象報告可以讓我們知道天氣的可能變化。"}, {"stage": 8, "unit": "三下｜天氣變變變", "q": "氣象預報說明天可能會下雨，出門時可以帶什麼？", "options": ["雨具", "磁鐵", "量筒", "放大鏡"], "exp": "知道天氣可能下雨，可以攜帶雨具，也要注意天氣變化。"}];

function attack(a,t){const b=TER[map[t.y][t.x]].d,gd=a.mg?t.res:t.def;t.hp-=Math.max(1,a.atk-gd-b);

async function enemyTurn(){for(const e of units.slice()){if(e.team!=='e'||e.hp<=0)continue;await sleep(350);
